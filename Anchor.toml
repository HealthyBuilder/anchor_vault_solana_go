[toolchain]
package_manager = "yarn"

[features]
resolution = true
skip-lint = false

[programs.localnet]
blueshift_anchor_vault = "22222222222222222222222222222222222222222222"

[registry]
url = "https://api.apr.dev"

[provider]
cluster = "localnet"
wallet = "~/.config/solana/id.json"

[scripts]
test = "yarn run ts-mocha -p ./tsconfig.json -t 1000000 tests/**/*.ts"

# The challenge requires program ID 2222..., which has no private key,
# so the local validator loads the .so at that address via genesis.
[[test.genesis]]
address = "22222222222222222222222222222222222222222222"
program = "target/deploy/blueshift_anchor_vault.so"

[test]
startup_wait = 30000
